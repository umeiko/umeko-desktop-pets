<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Umeko Pets · 桌宠资源</title>
<style>
  :root{font-family:Inter,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:#263b35;background:#f6f5f0;font-synthesis:none}
  *{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
  header,main,footer{max-width:1160px;margin:auto;padding:0 40px}header{height:94px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dedfd6}
  .brand{font-weight:760;font-size:21px;letter-spacing:-.7px}.brand span{font-weight:450;color:#77847b;margin-left:8px;font-size:15px;letter-spacing:0}
  .edition{font:12px ui-monospace,monospace;color:#718078}.intro{padding:48px 0 27px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
  .eyebrow{font:11px ui-monospace,monospace;letter-spacing:2px;color:#718078;margin:0 0 12px}h1{font-size:36px;letter-spacing:-1.3px;line-height:1.2;margin:0 0 13px;font-weight:650}.intro p{font-size:14px;color:#778079;line-height:1.7;margin:0}
  .categories{display:flex;gap:8px;margin:0 0 28px}.category{border:1px solid #dfe3d9;padding:9px 16px;border-radius:24px;color:#788078;font-size:13px}.category.active{background:#2f5948;border-color:#2f5948;color:white}.category small{opacity:.65;margin-left:8px}
  .controls{display:flex;gap:6px;background:#eeeee7;border:1px solid #e0e1d8;padding:4px;border-radius:24px;white-space:nowrap}.controls button{border:0;background:transparent;color:#748074;padding:7px 13px;font-size:12px;border-radius:20px}.controls button[aria-pressed=true]{background:white;color:#2f5948;box-shadow:0 1px 5px #253e3510}
  .pet[hidden]{display:none}.actions{grid-template-columns:repeat(auto-fit,minmax(37px,1fr))!important}.pets{display:grid;grid-template-columns:1fr 1fr;gap:22px}.pet{border:1px solid #dedfd5;border-radius:22px;background:#fffefb;overflow:hidden}.stage{height:300px;display:grid;place-items:center;position:relative;background-color:#e9ede4;background-image:radial-gradient(#6374600a 1px,transparent 1px);background-size:16px 16px;transition:background-color .2s}
  body.dark .stage{background-color:#232e2b;background-image:radial-gradient(#cbdac910 1px,transparent 1px)}.stage img{width:276px;height:276px;object-fit:contain;image-rendering:auto;user-select:none}.stage .state{position:absolute;left:18px;top:17px;color:#6d7b70;font-size:11px;letter-spacing:1px;border:1px solid #8e9c792d;background:#ffffff60;padding:6px 10px;border-radius:20px}.dark .stage .state{color:#d1dbd0;background:#293c3380;border-color:#60766a60}
  .info{padding:23px 24px 22px}.names{display:flex;justify-content:space-between;align-items:center;gap:10px}h2{font-size:23px;margin:0;letter-spacing:-.5px;font-weight:650}.code{color:#8a9188;font:10px ui-monospace,monospace}.en{font-size:11px;color:#8b9489;margin:7px 0 17px;letter-spacing:.5px}.desc{font-size:13px;color:#7a857a;line-height:1.8;min-height:46px;margin:0 0 19px}
  .actions{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:23px}.actions button{font-size:11px;white-space:nowrap;background:transparent;border:1px solid #e7e8df;color:#7e887e;padding:8px 2px;border-radius:8px}.actions button[aria-pressed=true]{background:#e8eee5;color:#2f5948;border-color:#b9cbb6}
  .download{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #eceee6;padding-top:18px}.download .spec{font-size:10px;color:#899185;line-height:1.7}.download a{font-size:12px;background:#2f5948;color:white;padding:11px 15px;border-radius:9px}.download a:hover{background:#244a3a}.download a:focus-visible,button:focus-visible{outline:3px solid #a9bd9d;outline-offset:3px}
  .how{display:grid;grid-template-columns:210px 1fr;gap:28px;padding:31px 0;margin-top:17px;border-bottom:1px solid #dedfd6}.how h3{font-size:14px;font-weight:600;margin:0 0 7px}.how .hint{font:10px ui-monospace,monospace;color:#8b9588}.steps{display:flex;align-items:flex-start;gap:26px;font-size:12px;line-height:1.8;color:#758171}.step{flex:1}.step b{font:10px ui-monospace,monospace;color:#74896b;display:block;margin-bottom:5px}footer{padding-top:22px;padding-bottom:28px;display:flex;justify-content:space-between;color:#8e968b;font-size:10px;line-height:1.7}
  @media(max-width:760px){header,main,footer{padding-left:20px;padding-right:20px}.intro{align-items:flex-start;flex-direction:column;padding-top:32px}h1{font-size:29px}.pets{grid-template-columns:1fr}.stage{height:270px}.stage img{width:250px;height:250px}.how{grid-template-columns:1fr;gap:15px}.steps{flex-direction:column;gap:16px}.code{display:none}footer{gap:16px;flex-wrap:wrap}}
</style>
<header><a class="brand" href="#">Umeko <span>Pets</span></a><span class="edition">ANIMALS & CHARACTERS</span></header>
<main>
  <section class="intro"><div><p class="eyebrow">A LITTLE COMPANY</p><h1>选一位朋友，陪你开工。</h1><p>摇摇尾巴，眨眨眼。把日常的小陪伴，放在桌面一角。</p></div><div class="controls" aria-label="透明背景检查"><button aria-pressed="true" data-theme="light">浅色背景</button><button aria-pressed="false" data-theme="dark">深色背景</button></div></section>
  <nav class="categories" aria-label="分类"><button class="category active" data-category="all" aria-pressed="true">全部</button><button class="category" data-category="animals" aria-pressed="false">动物</button><button class="category" data-category="characters" aria-pressed="false">人物 · BanG Dream!</button></nav>
  <section class="pets" id="pets" aria-label="桌宠资源"></section>
  <section class="how"><div><h3>放到你的桌面</h3><span class="hint">NO EXTRA DEPENDENCIES</span></div><div class="steps"><div class="step"><b>01 / 下载</b>选择喜欢的桌宠，下载 ZIP。</div><div class="step"><b>02 / 导入</b>设置 → Agent → 插件管理<br>→ 桌面小宠物 → 导入形象。</div><div class="step"><b>03 / 陪伴</b>选中形象，即可开始。<br>无需解压或安装其他组件。</div></div></section>
</main>
<footer><span>Umeko Pets · 透明循环动画 · 每只宠物独立导入</span><span>许可与人物出处请查看包内说明。</span></footer>
<script>
const labels={idle:'待机',thinking:'思考',working:'工作',waiting:'等待',done:'完成',error:'出错','idle-rare':'彩蛋'};
const root=document.querySelector('#pets');
let activeCategory='all';
const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function filterCards(){
  for(const card of root.children){
    const visible=activeCategory==='all'||card.dataset.category===activeCategory;
    card.hidden=!visible;
    const img=card.querySelector('img');
    if(img){const source=visible?img.dataset.animation:img.dataset.preview;if(img.getAttribute('src')!==source)img.src=source;}
  }
}
async function loadPets(){
  const response=await fetch('../catalog.json');if(!response.ok)throw new Error('无法读取目录');
  const catalog=await response.json();
  for(const pet of catalog.pets){
    const response=await fetch('../'+pet.manifest);if(!response.ok)throw new Error('无法读取形象');
    const manifest=await response.json();
    const folder='../'+pet.manifest.substring(0,pet.manifest.lastIndexOf('/')+1);
    const animations={...manifest.states};if(manifest.rareIdle)animations['idle-rare']=manifest.rareIdle.image;
    const meta=manifest.images[manifest.states.idle];
    const card=document.createElement('article');card.className='pet';card.dataset.pet=pet.id;card.dataset.category=pet.category;
    card.innerHTML=`<div class="stage"><span class="state">待机 / IDLE</span><img loading="lazy" alt="${escape(pet.name)}待机动画"></div><div class="info"><div class="names"><h2>${escape(pet.name)}</h2><span class="code">${escape(pet.id)}</span></div><p class="en">${escape(pet.englishName)}</p><p class="desc">${escape(pet.description)}</p><div class="actions" aria-label="${escape(pet.name)}动作">${Object.keys(animations).map(key=>`<button data-state="${key}" aria-pressed="${key==='idle'}">${labels[key]}</button>`).join('')}</div><div class="download"><div class="spec">${meta.width} × ${meta.height} · 透明循环动画<br>ZIP · ${(pet.bytes/1048576).toFixed(2)} MiB · v${escape(pet.version)}</div><a download href="../${escape(pet.download)}">下载宠物包 ↓</a></div></div>`;
    const img=card.querySelector('img');img.dataset.animation=folder+animations.idle;img.dataset.preview='../'+pet.preview;
    card.querySelector('.actions').addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;const state=button.dataset.state;img.dataset.animation=folder+animations[state];img.src=img.dataset.animation;img.alt=pet.name+labels[state]+'动画';card.querySelector('.state').textContent=labels[state]+' / '+state.toUpperCase();for(const item of card.querySelectorAll('[data-state]'))item.setAttribute('aria-pressed',String(item===button));});
    root.append(card);filterCards();
  }
}
for(const button of document.querySelectorAll('button[data-category]'))button.addEventListener('click',()=>{activeCategory=button.dataset.category;for(const item of document.querySelectorAll('button[data-category]')){item.classList.toggle('active',item===button);item.setAttribute('aria-pressed',String(item===button));}filterCards();});
for(const button of document.querySelectorAll('[data-theme]'))button.addEventListener('click',()=>{document.body.classList.toggle('dark',button.dataset.theme==='dark');for(const item of document.querySelectorAll('[data-theme]'))item.setAttribute('aria-pressed',String(item===button));});
loadPets().catch(error=>{const message=document.createElement('p');message.textContent=error.message+'。请通过仓库根目录的本地 HTTP 服务打开预览。';root.append(message);});
</script>
</html>
